backend:
  name: github
  repo: soroorkheirollahi/soroorkheirollahi.github.io
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "works"
    label: "Artworks"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Year", name: "year", widget: "string", required: false}
      - {label: "Medium", name: "medium", widget: "string", required: false}
      - {label: "Dimensions", name: "dimensions", widget: "string", required: false}
      - {label: "Media Type", name: "mediaType", widget: "select", options: ["image", "video", "youtube"], default: "image"}
      - {label: "File or Image", name: "fileUrl", widget: "image", required: false}
      - {label: "YouTube URL", name: "youtubeUrl", widget: "string", required: false}
      - {label: "Artist Statement / Note", name: "statement", widget: "text", required: false}
