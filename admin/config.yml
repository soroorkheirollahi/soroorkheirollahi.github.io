backend:
  name: github
  repo: soroorkheirollahi/soroorkheirollahi.github.io
  branch: main
  auth_type: implicit

media_folder: "assets/images"
public_folder: "assets/images"

collections:
  - name: "artworks"
    label: "Artworks"
    folder: "content"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Year", name: "year", widget: "string" }
      - { label: "Dimensions", name: "dimensions", widget: "string" }
      - { label: "Medium", name: "medium", widget: "string" }
      - { label: "Artwork File", name: "fileUrl", widget: "image" }
      - { label: "Statement", name: "statement", widget: "text", required: false }
